name: Build and lint

on:
  - push
  - pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check format
        run: |
          find . -path ./build -prune -o \( -name '*.c' -o -name '*.h' \) -print | xargs clang-format --style=file --dry-run -Werror
      
      - name: Configure
        run: |
          mkdir -p build
          cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      
      - name: Build
        run: |
          cmake --build build
      
      - name: Lint
        run: |
          run-clang-tidy -p=build

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cmake --build build --config Release
          
